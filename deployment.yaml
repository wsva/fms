# Modifying metadata.annotations does not trigger a rolling update.
# You need to modify spec.template.metadata.annotations, which is part of the Pod template,
# and Kubernetes uses it to decide whether to perform a rolling update.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: fms
  namespace: wsva
  annotations:
    build: "BUILD_TIME"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fms
  template:
    metadata:
      labels:
        app: fms
      annotations:
        build: "BUILD_TIME"
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: fms
          image: node:24.12.0
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: POSTGRES_PASSWORD
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: AUTH_SECRET
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: SMTP_HOST
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: SMTP_USER
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: SMTP_PASS
            - name: SMTP_FROM
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: SMTP_FROM
            - name: DATASET_ROOT
              value: "/fms_datasets"
            # Release mirror volume (written by mirror_releases.py on the host,
            # read by src/app/mirror + the landing's mirror-first release lookup).
            - name: FMS_MIRROR_DIR
              value: "/fms_mirror"
            - name: MAX_DATASET_UPLOAD_MB
              value: "512"
            # Bind the standalone server to every interface instead of the pod name.
            # server.js uses `process.env.HOSTNAME || '0.0.0.0'`, and Kubernetes injects
            # HOSTNAME=<pod name>, which makes Node bind the pod IP only -- so 127.0.0.1:3000
            # refuses connection and the app cannot call its own OAuth2 endpoints in-process
            # (see the loopback OAUTH2_TOKEN / OAUTH2_USERINFO below).
            - name: HOSTNAME
              value: "0.0.0.0"
          command:
            - sh
            - -c
            - |
              set -e
              git clone https://github.com/wsva/fms_build /home/node/app
              cd /home/node/app
              echo 'DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@db:5432/fmsdb' > .env
              echo 'BETTER_AUTH_URL=https://lusworkshop.site' >> .env
              echo 'BETTER_AUTH_SECRET="${AUTH_SECRET}"' >> .env
              echo 'OAUTH2_AUTHORIZATION=https://lusworkshop.site/api/oauth2/authorize' >> .env
              # Server-to-server calls: reach our own endpoints over loopback, not through
              # the public URL. A hairpin to lusworkshop.site resolves to the node's IP and is
              # DNAT'ed by kube-proxy to the nginx pod IP before Calico evaluates the fms
              # egress policy, whose ipBlock `except` covers 10.0.0.0/8 -- so the call is
              # dropped and Better Auth reports oauth_code_verification_failed.
              # Requires HOSTNAME=0.0.0.0 above. OAUTH2_AUTHORIZATION stays public: the
              # browser navigates to it. BETTER_AUTH_URL stays public too, it builds the
              # redirect_uri the provider must recognise.
              echo 'OAUTH2_TOKEN=http://127.0.0.1:3000/api/oauth2/token' >> .env
              echo 'OAUTH2_USERINFO=http://127.0.0.1:3000/api/oauth2/userinfo' >> .env
              echo 'OAUTH2_LOGOUT=https://lusworkshop.site/api/oauth2/logout' >> .env
              echo 'OAUTH2_CLIENT_ID=als_next.js' >> .env
              echo 'OAUTH2_CHECK_IP=false' >> .env
              echo 'OAUTH2_RSA_KEY_FILE="/ssl/rsa.key"' >> .env
              echo 'OAUTH2_RSA_PUB_FILE="/ssl/rsa.pub"' >> .env
              echo 'SMTP_HOST=${SMTP_HOST}' >> .env
              echo 'SMTP_PORT=465' >> .env
              echo 'SMTP_SECURE=true' >> .env
              echo 'SMTP_USER=${SMTP_USER}' >> .env
              echo 'SMTP_PASS=${SMTP_PASS}' >> .env
              echo 'SMTP_FROM=${SMTP_FROM}' >> .env
              node server.js
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: fms-data
              mountPath: /fms_data
            - name: fms-datasets
              mountPath: /fms_datasets
            # Served read-only: only the host's cron sync writes this volume.
            - name: fms-mirror
              mountPath: /fms_mirror
              readOnly: true
            - name: ssl
              mountPath: /ssl
      volumes:
        - name: fms-data
          hostPath:
            path: /wsva/data/fms_data
            type: Directory
        - name: fms-datasets
          hostPath:
            path: /wsva/data/fms_datasets
            type: Directory
        - name: fms-mirror
          hostPath:
            path: /wsva/data/fms_mirror
            type: Directory
        - name: ssl
          hostPath:
            path: /wsva/ssl
---
apiVersion: v1
kind: Service
metadata:
  name: fms
  namespace: wsva
spec:
  type: ClusterIP
  selector:
    app: fms
  ports:
    - port: 3000
      targetPort: 3000